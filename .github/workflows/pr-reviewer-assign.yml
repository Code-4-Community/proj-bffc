name: PR Reviewer Assignment

on:
  pull_request:
    # `unlabeled` is here so that removing `no-review` assigns a reviewer after
    # the fact; the job `if` below narrows it to that one label.
    types: [opened, ready_for_review, reopened, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    # Skip drafts and any PR carrying the `no-review` opt-out label. On an
    # `unlabeled` event the payload already reflects the post-removal label
    # set, so a `no-review` removal passes the `contains` check.
    if: >-
      ${{ !github.event.pull_request.draft
          && !contains(github.event.pull_request.labels.*.name, 'no-review')
          && (github.event.action != 'unlabeled' || github.event.label.name == 'no-review') }}
    steps:
      - name: Checkout bot-state branch
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: bot-state
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign reviewers and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const BOT_STATE_DIR = 'bot-state';
            const configPath = path.join(BOT_STATE_DIR, 'config.json');
            const statePath = path.join(BOT_STATE_DIR, 'state.json');
            const prsDir = path.join(BOT_STATE_DIR, 'prs');

            if (!fs.existsSync(configPath)) {
              core.setFailed('config.json not found on bot-state branch. See .github/pr-bot/README.md.');
              return;
            }
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const state = fs.existsSync(statePath)
              ? JSON.parse(fs.readFileSync(statePath, 'utf8'))
              : { lead_cursor: 0, roster_cursor: 0 };

            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const prUrl = pr.html_url;
            const prTitle = pr.title;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const prFileKey = `${context.repo.owner}_${context.repo.repo}_${prNumber}`;
            const prFilePath = path.join(prsDir, `${prFileKey}.json`);

            if (!fs.existsSync(prsDir)) {
              fs.mkdirSync(prsDir, { recursive: true });
            }

            async function slackApi(method, body) {
              try {
                const resp = await fetch(`https://slack.com/api/${method}`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  },
                  body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (!data.ok) console.log(`Slack ${method} error: ${data.error}`);
                return data;
              } catch (err) {
                console.log(`Slack ${method} failed: ${err.message}`);
                return { ok: false };
              }
            }

            const STATUS_EMOJI = {
              pending:           ':hourglass_flowing_sand:',
              approved:          ':approved:',
              changes_requested: ':git-request-changes:',
              commented:         ':git-comment:',
            };
            const STATUS_LABEL = {
              pending:           'Pending',
              approved:          'Approved',
              changes_requested: 'Changes Requested',
              commented:         'Commented',
            };

            function buildBlocks({ prUrl, prNumber, prTitle, prAuthor, reviewers }) {
              const allDone = reviewers.every(r => r.status !== 'pending');
              const anyChangesRequested = reviewers.some(r => r.status === 'changes_requested');

              let headerText;
              if (allDone && !anyChangesRequested) {
                headerText = ':approved:  All Reviews Complete';
              } else if (allDone && anyChangesRequested) {
                headerText = ':git-request-changes:  Changes Requested';
              } else {
                headerText = ':evergreen_tree:  Review Requested';
              }

              const reviewerLines = reviewers.map(r =>
                `${STATUS_EMOJI[r.status]}  <@${r.slack}> — ${STATUS_LABEL[r.status]}`
              );

              const infoText = allDone
                ? `*<${prUrl}|#${prNumber} ${prTitle}>*\nAuthor: *${prAuthor}*`
                : `*<${prUrl}|#${prNumber} ${prTitle}>*\nAuthor: *${prAuthor}*\n_Please review as soon as you can! Thank you!_`;

              return [
                {
                  type: 'header',
                  text: { type: 'plain_text', text: headerText, emoji: true },
                },
                {
                  type: 'section',
                  text: { type: 'mrkdwn', text: infoText },
                },
                { type: 'divider' },
                {
                  type: 'section',
                  text: { type: 'mrkdwn', text: reviewerLines.join('\n') },
                },
              ];
            }

            function sameLogin(a, b) {
              return String(a).toLowerCase() === String(b).toLowerCase();
            }

            function nextFrom(list, cursor, skipLogins) {
              if (!list || list.length === 0) {
                return { picked: null, newCursor: cursor || 0 };
              }
              const skip = new Set((skipLogins || []).map(l => String(l).toLowerCase()));
              for (let i = 0; i < list.length; i++) {
                const idx = (cursor + i) % list.length;
                const candidate = list[idx];
                if (!skip.has(String(candidate).toLowerCase())) {
                  return { picked: candidate, newCursor: (idx + 1) % list.length };
                }
              }
              return { picked: null, newCursor: cursor || 0 };
            }

            if (fs.existsSync(prFilePath)) {
              const existing = JSON.parse(fs.readFileSync(prFilePath, 'utf8'));

              if (existing.status === 'open') {
                console.log(`PR #${prNumber} already has reviewers. Skipping.`);
                return;
              }

              console.log(`PR #${prNumber} was "${existing.status}", now reopened. Re-notifying.`);
              existing.status = 'open';
              existing.last_reminded_at = null;

              const reopenReviewers = [existing.main_reviewer, existing.second_reviewer].filter(Boolean);

              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: reopenReviewers,
                });
              } catch (err) {
                console.log(`Warning: could not re-request reviewers: ${err.message}`);
              }

              const reviewerObjs = [
                { login: existing.main_reviewer, slack: existing.main_reviewer_slack, status: 'pending' },
              ];
              if (existing.second_reviewer) {
                reviewerObjs.push({
                  login: existing.second_reviewer,
                  slack: existing.second_reviewer_slack,
                  status: 'pending',
                });
              }

              const blocks = buildBlocks({ prUrl, prNumber, prTitle, prAuthor, reviewers: reviewerObjs });
              const res = await slackApi('chat.postMessage', {
                channel: config.slack_channel_id,
                text: `PR reopened: #${prNumber} ${prTitle}`,
                blocks,
              });
              if (res.ok) existing.slack_thread_ts = res.ts;

              fs.writeFileSync(prFilePath, JSON.stringify(existing, null, 2) + '\n');
              return;
            }

            const leads = config.leads || [];
            const roster = config.roster || [];
            let leadCursor = state.lead_cursor || 0;
            let rosterCursor = state.roster_cursor || 0;

            const authorIsLead = leads.some(l => sameLogin(l, prAuthor));
            let leadReviewer;
            if (authorIsLead) {
              leadReviewer = leads.find(l => !sameLogin(l, prAuthor));
            } else {
              const picked = nextFrom(leads, leadCursor, [prAuthor]);
              leadReviewer = picked.picked;
              leadCursor = picked.newCursor;
            }

            const pickedDev = nextFrom(roster, rosterCursor, [prAuthor, leadReviewer]);
            const devReviewer = pickedDev.picked;
            rosterCursor = pickedDev.newCursor;

            if (!leadReviewer || !devReviewer) {
              core.setFailed(
                `Could not assign both reviewers (lead=${leadReviewer || 'none'}, developer=${devReviewer || 'none'}). Check leads/roster on bot-state.`
              );
              return;
            }

            const mainReviewer = leadReviewer;
            const secondReviewer = devReviewer;
            const mainReviewerSlack = config.github_to_slack[mainReviewer];
            const secondReviewerSlack = config.github_to_slack[secondReviewer];
            if (!mainReviewerSlack || !secondReviewerSlack) {
              core.setFailed(`Missing Slack ID mapping for ${mainReviewer} and/or ${secondReviewer}.`);
              return;
            }

            console.log(
              `Assigning lead=${mainReviewer} + developer=${secondReviewer} to PR #${prNumber} (author: ${prAuthor})`
            );

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: [mainReviewer, secondReviewer],
              });
              console.log(`Review requested from ${mainReviewer}, ${secondReviewer}`);
            } catch (err) {
              console.log(`Warning: could not request reviewers: ${err.message}`);
            }

            const reviewerObjs = [
              { login: mainReviewer, slack: mainReviewerSlack, status: 'pending' },
              { login: secondReviewer, slack: secondReviewerSlack, status: 'pending' },
            ];
            const blocks = buildBlocks({ prUrl, prNumber, prTitle, prAuthor, reviewers: reviewerObjs });

            const slackRes = await slackApi('chat.postMessage', {
              channel: config.slack_channel_id,
              text: `New PR for review: #${prNumber} ${prTitle}`,
              blocks,
            });
            const slackTs = slackRes.ok ? slackRes.ts : null;

            state.lead_cursor = leadCursor;
            state.roster_cursor = rosterCursor;
            fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');

            const prData = {
              pr_url: prUrl,
              repo: repoFullName,
              pr_number: prNumber,
              author: prAuthor,
              main_reviewer: mainReviewer,
              main_reviewer_slack: mainReviewerSlack,
              second_reviewer: secondReviewer,
              second_reviewer_slack: secondReviewerSlack,
              created_at: new Date().toISOString(),
              last_reminded_at: null,
              slack_thread_ts: slackTs,
              status: 'open',
            };
            fs.writeFileSync(prFilePath, JSON.stringify(prData, null, 2) + '\n');
            console.log(`State written: lead_cursor=${leadCursor}, roster_cursor=${rosterCursor}, file=${prFilePath}`);

      - name: Commit and push bot-state
        working-directory: bot-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "bot: assign reviewer for PR #${{ github.event.pull_request.number }}"

          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin bot-state; then
              echo "Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 2s…"
            sleep 2
          done

          echo "::error::Failed to push bot-state after 3 attempts"
          exit 1
